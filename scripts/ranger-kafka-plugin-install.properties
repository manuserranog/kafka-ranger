POLICY_MGR_URL=http://ranger:6080
REPOSITORY_NAME=dev_kafka
COMPONENT_INSTALL_DIR_NAME=/opt/kafka

CUSTOM_USER=kafka
CUSTOM_GROUP=hadoop

# Policy cache directory
POLICY_CACHE_FILE_PATH=/opt/kafka/plugin-policy-cache

# Credential provider (not used without SSL)
CREDENTIAL_PROVIDER_FILE=/opt/kafka/conf/ranger-kafka.jceks

XAAUDIT.SUMMARY.ENABLE=true

# Solr audit (v2 legacy config)
XAAUDIT.SOLR.IS_ENABLED=true
XAAUDIT.SOLR.MAX_QUEUE_SIZE=1
XAAUDIT.SOLR.MAX_FLUSH_INTERVAL_MS=1000
XAAUDIT.SOLR.SOLR_URL=http://ranger-solr:8983/solr/ranger_audits

# Solr audit (v3 config - required by Ranger 3.x templates)
XAAUDIT.SOLR.ENABLE=true
XAAUDIT.SOLR.URL=http://ranger-solr:8983/solr/ranger_audits
XAAUDIT.SOLR.USER=NONE
XAAUDIT.SOLR.PASSWORD=NONE
XAAUDIT.SOLR.ZOOKEEPER=NONE
XAAUDIT.SOLR.FILE_SPOOL_DIR=/var/log/kafka/audit/solr/spool
XAAUDIT.SOLR.USE_INMEMORY_JAAS_CFG=false

# JAAS client audit config - set to NONE (required by XmlConfigChanger token validation)
# ranger-kafka.sh will clear these values in the generated XML after setup
XAAUDIT.JAAS.CLIENT.LOGIN_MODULE_NAME=NONE
XAAUDIT.JAAS.CLIENT.LOGIN_MODULE_CONTROL_FLAG=NONE
XAAUDIT.JAAS.CLIENT.OPTION.USE_KEY_TAB=NONE
XAAUDIT.JAAS.CLIENT.OPTION.STORE_KEY=NONE
XAAUDIT.JAAS.CLIENT.OPTION.USE_TICKET_CACHE=NONE
XAAUDIT.JAAS.CLIENT.OPTION.SERVICE_NAME=NONE
XAAUDIT.JAAS.CLIENT.OPTION.KEY_TAB=NONE
XAAUDIT.JAAS.CLIENT.OPTION.PRINCIPAL=NONE

# Elasticsearch audit (disabled)
XAAUDIT.ELASTICSEARCH.ENABLE=false
XAAUDIT.ELASTICSEARCH.URL=NONE
XAAUDIT.ELASTICSEARCH.USER=NONE
XAAUDIT.ELASTICSEARCH.PASSWORD=NONE
XAAUDIT.ELASTICSEARCH.INDEX=NONE
XAAUDIT.ELASTICSEARCH.PORT=NONE
XAAUDIT.ELASTICSEARCH.PROTOCOL=NONE

# Amazon CloudWatch audit (disabled)
XAAUDIT.AMAZON_CLOUDWATCH.ENABLE=false
XAAUDIT.AMAZON_CLOUDWATCH.LOG_GROUP=NONE
XAAUDIT.AMAZON_CLOUDWATCH.LOG_STREAM_PREFIX=NONE
XAAUDIT.AMAZON_CLOUDWATCH.FILE_SPOOL_DIR=NONE
XAAUDIT.AMAZON_CLOUDWATCH.REGION=NONE

# Log4j audit (disabled)
XAAUDIT.LOG4J.ENABLE=false
XAAUDIT.LOG4J.IS_ASYNC=false
XAAUDIT.LOG4J.ASYNC.MAX.QUEUE.SIZE=10240
XAAUDIT.LOG4J.ASYNC.MAX.FLUSH.INTERVAL.MS=30000
XAAUDIT.LOG4J.DESTINATION.LOG4J=false
XAAUDIT.LOG4J.DESTINATION.LOG4J.LOGGER=xaaudit

# HDFS audit (disabled - no HDFS in this setup)
XAAUDIT.HDFS.IS_ENABLED=false
XAAUDIT.HDFS.ENABLE=false
XAAUDIT.HDFS.HDFS_DIR=hdfs://ranger-hadoop:9000/ranger/audit
XAAUDIT.HDFS.FILE_SPOOL_DIR=/var/log/kafka/audit/hdfs/spool
XAAUDIT.HDFS.DESTINATION_DIRECTORY=/ranger/audit
XAAUDIT.HDFS.DESTINTATION_FILE=hadoop
XAAUDIT.HDFS.DESTINTATION_FLUSH_INTERVAL_SECONDS=900
XAAUDIT.HDFS.DESTINTATION_ROLLOVER_INTERVAL_SECONDS=86400
XAAUDIT.HDFS.DESTINTATION_OPEN_RETRY_INTERVAL_SECONDS=60
XAAUDIT.HDFS.LOCAL_BUFFER_DIRECTORY=/var/log/kafka/audit
XAAUDIT.HDFS.LOCAL_ARCHIVE_DIRECTORY=/var/log/kafka/audit/archive
XAAUDIT.HDFS.LOCAL_ARCHIVE_MAX_FILE_COUNT=10
XAAUDIT.HDFS.LOCAL_BUFFER_FILE=%time:yyyyMMdd-HHmm.ss%.log
XAAUDIT.HDFS.LOCAL_BUFFER_FLUSH_INTERVAL_SECONDS=60
XAAUDIT.HDFS.LOCAL_BUFFER_ROLLOVER_INTERVAL_SECONDS=600
XAAUDIT.HDFS.AZURE_ACCOUNTNAME=__REPLACE_AZURE_ACCOUNT_NAME
XAAUDIT.HDFS.AZURE_ACCOUNTKEY=__REPLACE_AZURE_ACCOUNT_KEY
XAAUDIT.HDFS.AZURE_SHELL_KEY_PROVIDER=__REPLACE_AZURE_SHELL_KEY_PROVIDER
XAAUDIT.HDFS.AZURE_ACCOUNTKEY_PROVIDER=__REPLACE_AZURE_ACCOUNT_KEY_PROVIDER

# SSL (not used for plain SASL setup)
SSL_KEYSTORE_FILE_PATH=/etc/hadoop/conf/ranger-plugin-keystore.jks
SSL_KEYSTORE_PASSWORD=myKeyFilePassword
SSL_TRUSTSTORE_FILE_PATH=/etc/hadoop/conf/ranger-plugin-truststore.jks
SSL_TRUSTSTORE_PASSWORD=changeit